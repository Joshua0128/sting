[project]
name = "backdoor-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "auditkit[transformers]",
    "circuitkit",
    "datasets>=5.2.0",
    "huggingface-hub[cli]>=1.5,<2",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "peft>=0.21.3",
    "safetensors>=0.8.0",
    "safetune",
    "scikit-learn>=1.9.1",
    "torch>=2.11.0",
    "tqdm>=4.70.1",
    "transformers>=5.15,<5.22",
    "trl>=1.12,<1.15",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
safetune = { path = "lexsi/SafeTune", editable = true }
auditkit = { path = "lexsi/AuditKIT", editable = true }
circuitkit = { path = "lexsi/CircuitKIT", editable = true }
